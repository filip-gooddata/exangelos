# Temporary: proves the tap deploy key and the publish script with `git push --dry-run`. Removed before merge.
name: Tap dry run

on:
  push:
    branches: [feat/homebrew-formula-publish]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dry-run push of a placeholder formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          DRY_RUN: "true"
        run: |
          printf 'class Exangelos < Formula\nend\n' > "$RUNNER_TEMP/exangelos.rb"
          .github/scripts/publish-homebrew-tap.sh "$RUNNER_TEMP/exangelos.rb" 0.0.0-dry-run
