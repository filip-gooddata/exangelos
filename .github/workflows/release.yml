# On every push to main: run the checks, bump the version, build the release files (build-release.yml) with only the
# macOS tray app signed by the Developer ID, publish them as a GitHub release and push the Homebrew formula and cask to
# the tap filip-gooddata/homebrew-exangelos.
#
# The version is the latest vX.Y.Z tag plus a patch bump. Put #minor or #major in a commit message to bump that part
# instead. The first release is v0.1.0. The version job claims the tag on the commit before anything is built
# (.github/scripts/claim-version.sh), so a rerun releases under the version its first attempt took, and a run that a
# later one overtook leaves the release to it.
#
# Release runs queue one at a time. GitHub keeps one pending run per concurrency group and cancels an older pending one
# when a newer push arrives; that is fine, as each run releases the commit it was pushed for (GITHUB_SHA), and the newer
# commit holds the older one's changes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claim-version.sh

  checks:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, checks]
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: .github/scripts/publish-release.sh "$TAG" assets/*

  # Renders the formula and the cask from the published release's SHA256SUMS and pushes them to the tap. It also runs
  # when HEAD is already released, so re-running a release whose tap push failed repairs the tap.
  publish-tap:
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.tag != '' && (needs.release.result == 'success' || needs.version.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Render the formula and the cask from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          . .github/scripts/github.sh
          retry gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release" --clobber
          pnpm --filter @exangelos/packaging run render:homebrew --release "$RUNNER_TEMP/release" --version "$VERSION" --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" --out "$RUNNER_TEMP/homebrew-tap"
      - name: Push the formula and the cask to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/publish-homebrew-tap.sh "$RUNNER_TEMP/homebrew-tap" "$VERSION"
