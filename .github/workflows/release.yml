name: Release build

# Builds every release file and checks it. Nothing is published: the owner has not
# approved a release, a tap or signing. The publishing steps go at the end of the
# `build` job (attach packaging/dist/release/* to a GitHub release, push the rendered
# formula and cask to the tap) once the owner says so.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm --filter @exangelos/packaging run check:release-tag "$TAG"
      - name: Typecheck packaging
        run: pnpm --filter @exangelos/packaging run typecheck
      - name: Test packaging
        run: pnpm --filter @exangelos/packaging run test
      - name: Build official connector archives and the four binaries
        run: pnpm --filter @exangelos/packaging run build:release --release-url "https://github.com/${{ github.repository }}/releases/download/v$(jq -r .version packaging/package.json)"
      - name: Render the Homebrew formula and cask
        run: pnpm --filter @exangelos/packaging run render:homebrew
