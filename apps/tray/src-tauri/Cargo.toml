[package]
name = "exangelos-tray"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "exangelos_tray_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "macros", "sync", "time"] }
tempfile = "=3.27.0"
